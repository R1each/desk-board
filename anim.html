<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07080c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<title>交易台动画 · 模拟盘</title>
<style>
:root{
  --bg:#07080c;
  --panel:#0b0c10;
  --panel2:#101218;
  --line:rgba(255,255,255,.09);
  --line2:rgba(0,232,255,.18);
  --tx:#e8eef7;
  --mut:#8b93a7;
  --dim:#5c6478;
  --cyan:#00e8ff;
  --blue:#4d8dff;
  --mag:#ff2bd6;
  --amber:#ffcc44;
  --green:#3effa8;
  --red:#ff5b73;
  --c-侦察兵:#00e8ff;
  --c-看图员:#4d8dff;
  --c-军师:#ff2bd6;
  --c-风控:#ffcc44;
  --c-执行员:#3effa8;
  --sans:"Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","PingFang SC",sans-serif;
  --mono:"IBM Plex Mono","ui-monospace","SF Mono","Cascadia Mono","Noto Sans Mono CJK SC","Noto Sans SC",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 var(--sans);min-height:100%}
body{overflow-x:hidden}
.bgfx,.gridbg,.scanlines{position:fixed;inset:0;pointer-events:none}
.bgfx{z-index:0}
.gridbg{z-index:0;background-image:linear-gradient(rgba(0,232,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,232,255,.04) 1px,transparent 1px);background-size:48px 48px;animation:gridshift 48s linear infinite;opacity:.55}
.scanlines{z-index:50;background:repeating-linear-gradient(180deg,transparent 0 2px,rgba(0,0,0,.12) 3px);mix-blend-mode:overlay;opacity:.35}
@keyframes gridshift{to{background-position:0 48px,48px 0}}
.shell{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:12px 14px 88px;display:grid;gap:12px;grid-template-columns:280px minmax(0,1fr) 340px;grid-template-areas:"top top top" "tick tick tick" "hero hero hero" "agents flow logs" "bar bar bar"}
.top{grid-area:top;display:flex;align-items:flex-start;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.brand .title{font-size:18px;font-weight:700;letter-spacing:.04em}
.brand .sub{color:var(--mut);font-size:12px;margin-top:2px;max-width:36ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;margin-left:8px;padding:1px 8px;border:1px solid var(--line2);border-radius:999px;color:var(--cyan);font-size:11px;font-weight:500;letter-spacing:.08em;vertical-align:2px}
.head-stats{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end;flex:1;min-width:0;justify-content:center}
.hstat .k{display:block;color:var(--dim);font-size:10px;letter-spacing:.12em}
.hstat .v{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.hstat.eq .v{font-size:28px}
.head-right{text-align:right;color:var(--mut);font-size:12px}
.run{display:flex;align-items:center;justify-content:flex-end;gap:6px;color:var(--tx);font-family:var(--mono);font-size:13px}
.run-dot{width:8px;height:8px;border-radius:50%;background:var(--dim);box-shadow:0 0 0 0 transparent;flex:0 0 auto}
.run.on .run-dot{background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.4s step-end infinite}
.run.stale .run-dot{background:var(--red);box-shadow:0 0 8px var(--red);animation:none}
.run.snap .run-dot{background:var(--amber);animation:none}
@keyframes blink{50%{opacity:.35}}
.nav{display:inline-block;margin-top:6px;color:var(--cyan);text-decoration:none;font-size:12px;border:1px solid var(--line2);border-radius:999px;padding:2px 10px}
.nav:hover{background:rgba(0,232,255,.08)}
.ticker{grid-area:tick;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:rgba(11,12,16,.85);height:28px;display:flex;align-items:center}
.ticker-track{display:inline-flex;gap:2.2rem;white-space:nowrap;padding:0 16px;font-family:var(--mono);font-size:12px;color:var(--mut);animation:marquee 48s linear infinite;will-change:transform}
.ticker-track span{color:var(--tx)}
.ticker-track .r{color:var(--red)}.ticker-track .g{color:var(--green)}.ticker-track .a{color:var(--amber)}.ticker-track .p{color:var(--mag)}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.hero{grid-area:hero;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px 10px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;align-items:stretch}
.hero-left h2{margin:0 0 2px;font-size:12px;letter-spacing:.16em;color:var(--mut);font-weight:500}
.hero-pnl{font-family:var(--mono);font-size:42px;font-weight:600;letter-spacing:-.03em;line-height:1;margin:4px 0 8px;text-shadow:0 0 18px color-mix(in srgb, currentColor 45%, transparent)}
.hero-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.hero-grid div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.hero-grid .k{display:block;color:var(--dim);font-size:11px}
.hero-grid b{font-family:var(--mono);font-size:15px;font-weight:600}
.fx{color:var(--dim);font-size:11px;margin-top:8px}
.chart-wrap{position:relative;min-height:120px}
.chart-wrap .lab{position:absolute;top:0;left:0;color:var(--dim);font-size:11px;letter-spacing:.1em}
.chart-wrap svg{width:100%;height:96px;display:block;margin-top:16px}
.hero-use{margin-top:8px;font-size:12px;color:var(--mut);line-height:1.45}
.hero-use b{font-family:var(--mono);font-weight:600;color:var(--tx)}
.books{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;grid-column:1/-1}
.books.shadow{margin-top:4px}
.shadow-lab{grid-column:1/-1;font-size:11px;color:var(--mut);letter-spacing:.06em;margin:2px 0 0}
.book{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.book.shadow{opacity:.95;border-style:dashed}
.book h3{margin:0 0 6px;font-size:12px;font-weight:500;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
.book .tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.book h3 span{font-family:var(--mono);white-space:nowrap}
.book .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--mut)}
.book b{font-family:var(--mono);font-weight:600;color:var(--tx);font-size:13px;white-space:nowrap;margin-left:auto}
.book .spark{width:84px;height:22px;display:block;margin-top:4px}
.agents{grid-area:agents;display:flex;flex-direction:column;gap:8px}
.acard{display:grid;grid-template-columns:48px 1fr auto;grid-template-rows:auto auto auto auto;gap:0 8px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;transition:border-color .3s,box-shadow .3s}
.acard .tile{grid-row:1/3;width:44px;height:44px;border-radius:10px;background:#0a0c12;border:1px solid color-mix(in srgb, var(--ac,var(--cyan)) 45%, transparent);display:flex;align-items:center;justify-content:center;overflow:hidden}
.acard .tile svg{width:40px;height:40px}
.acard .nm{font-weight:700;font-size:14px;align-self:end}
.acard .badge{grid-column:3;grid-row:1/3;align-self:center;font-family:var(--mono);font-size:10px;letter-spacing:.06em;border-radius:999px;padding:3px 7px;border:1px solid currentColor;color:var(--ac,var(--mut));background:color-mix(in srgb, var(--ac,var(--mut)) 12%, transparent)}
.acard .badge.idle,.acard .badge.off{color:var(--mut);border-color:var(--line)}
.acard .role{grid-column:2/4;color:var(--mut);font-size:12px}
.acard .rule{grid-column:1/4;font-size:12px;color:var(--ac,var(--cyan));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .act{grid-column:1/4;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard.active{border-color:color-mix(in srgb, var(--ac) 70%, #fff 0%);box-shadow:0 0 0 1px color-mix(in srgb, var(--ac) 40%, transparent),0 0 22px color-mix(in srgb, var(--ac) 28%, transparent);animation:cardpulse 2.4s ease-in-out infinite}
@keyframes cardpulse{50%{box-shadow:0 0 0 1px color-mix(in srgb, var(--ac) 55%, transparent),0 0 28px color-mix(in srgb, var(--ac) 42%, transparent)}}
.flow-wrap{grid-area:flow;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 12px 14px;min-width:0}
.sec-h{font-size:11px;letter-spacing:.16em;color:var(--mut);margin:0 0 8px;font-weight:500;display:flex;align-items:center;gap:8px}
.term-cmd{font-family:var(--mono);letter-spacing:0;color:var(--dim);font-size:11px}
.cands{display:flex;flex-wrap:wrap;gap:6px;min-height:28px;margin-bottom:10px}
.chip{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line2);background:rgba(0,232,255,.06);color:var(--tx)}
.chip.shadow{border-color:rgba(255,43,214,.4);background:rgba(255,43,214,.08);color:#ffc6ef}
.chip.muted{color:var(--dim);border-style:dashed;background:transparent}
.pipeline{position:relative;min-height:132px;margin:4px 0 10px}
.pipe-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:0}
#pipeGlow{fill:none;stroke:rgba(0,232,255,.18);stroke-width:6;stroke-linecap:round;filter:blur(2px)}
#pipePath{fill:none;stroke:rgba(180,220,255,.28);stroke-width:1.4;stroke-dasharray:5 7;stroke-linecap:round}
.packets{position:absolute;inset:0;z-index:2;pointer-events:none}
.pkt{position:absolute;left:0;top:0;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;pointer-events:none;will-change:transform;box-shadow:0 0 10px currentColor}
.nodes{position:relative;z-index:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;align-items:start}
.node{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.node .orb{position:relative;width:54px;height:54px;border-radius:50%;background:#0a0c12;border:1px solid color-mix(in srgb, var(--ac) 55%, transparent);display:flex;align-items:center;justify-content:center;box-shadow:0 0 14px color-mix(in srgb, var(--ac) 22%, transparent)}
.node .orb svg{width:46px;height:46px;border-radius:50%}
.node .orb .radar{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 68%,color-mix(in srgb, var(--ac) 70%, transparent) 86%,transparent 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:sweep 2.6s linear infinite;pointer-events:none;display:none}
.node.scanning .orb .radar{display:block}
.node.active .orb{animation:orbpulse 2.2s ease-in-out infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
@keyframes orbpulse{50%{box-shadow:0 0 22px color-mix(in srgb, var(--ac) 55%, transparent)}}
.node .nm{font-size:12px;font-weight:700}
.node .stt{font-size:11px;color:var(--dim);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .hold{display:flex;flex-direction:column;gap:3px;min-height:22px;width:100%}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tile-s{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.tile-s .k{display:block;color:var(--dim);font-size:10px;letter-spacing:.08em}
.tile-s .v{font-family:var(--mono);font-size:14px;font-weight:600}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.controls button,.controls select{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font:12px var(--sans);cursor:pointer}
.controls button:hover{border-color:var(--line2)}
.note{color:var(--dim);font-size:11px}
.logs{grid-area:logs;display:flex;flex-direction:column;gap:8px;min-width:0}
.term-panel,.table-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.term{font-family:var(--mono);font-size:11px;line-height:1.45;height:220px;overflow:auto;background:#07080c;border-radius:8px;padding:8px;border:1px solid var(--line);color:#b8c0d0}
.term .ln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term .t{color:var(--dim);margin-right:8px}
.term .cur{display:inline-block;width:.6ch;height:1em;background:var(--green);margin-left:3px;animation:blink 1s step-end infinite;vertical-align:-1px}
.dlog{max-height:280px;overflow:auto}
.drow{display:grid;grid-template-columns:52px 52px minmax(0,1fr);gap:6px;padding:6px 2px;border-bottom:1px solid var(--line);font-size:12px;align-items:start}
.drow .tm{font-family:var(--mono);color:var(--dim)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.04em;border-radius:4px;padding:1px 5px;border:1px solid currentColor;text-align:center}
.tag.skip{color:var(--red)}.tag.enter{color:var(--green)}.tag.shadow{color:var(--mag)}.tag.wait{color:var(--amber)}.tag.misc{color:var(--mut)}
.drow .sym{font-weight:600}
.drow .why{color:var(--mut);font-size:11px;grid-column:1/-1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{grid-area:bar;position:sticky;bottom:8px;z-index:20;display:flex;gap:0;overflow:auto;background:rgba(11,12,16,.92);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bar .cell{flex:1 0 auto;min-width:140px;padding:8px 12px;border-right:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:12px}
.bar .cell:last-child{border-right:0}
.bar i{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:0 0 auto}
.bar .cell.active i{background:var(--ac);box-shadow:0 0 8px var(--ac)}
.bar .who{font-weight:700;color:var(--ac,#fff)}
.bar .tagline{color:var(--mut);white-space:nowrap}
.g{color:var(--green)}.r{color:var(--red)}.a{color:var(--amber)}.m{color:var(--mut)}.p{color:var(--mag)}
.more{grid-column:1/-1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px 12px}
.more summary{cursor:pointer;color:var(--mut);list-style:none;font-size:13px}
.more summary::-webkit-details-marker{display:none}
.more .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.more .ln{display:flex;gap:8px;font-size:12px;color:var(--mut);font-family:var(--mono);white-space:nowrap;overflow:hidden}
.foot{grid-column:1/-1;color:var(--dim);font-size:11px;padding:0 4px}
@media(max-width:980px){
  .shell{grid-template-columns:1fr;grid-template-areas:"top" "tick" "hero" "agents" "flow" "logs" "bar";padding:8px 8px 96px}
  .top{flex-direction:column;align-items:stretch}
  .hero{grid-template-columns:1fr}
  .hero-grid{grid-template-columns:repeat(2,1fr)}
  .books{grid-template-columns:repeat(2,1fr)}
  .hero-pnl{font-size:34px}
  .head-stats{display:grid !important;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px;justify-content:stretch;width:100%;flex:none}
  .hstat.eq{grid-column:1/-1}
  .hstat.eq .v{font-size:26px}
  .hstat .v{font-size:18px;white-space:nowrap}
  .hstat .k{white-space:nowrap}
  .head-right{text-align:left;width:100%}
  .run{justify-content:flex-start;flex-wrap:wrap}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .nodes{min-width:520px}
  .pipeline{overflow-x:auto}
  .more .grid{grid-template-columns:1fr}
  .bar{bottom:0;border-radius:12px 12px 0 0}
}
@media(max-width:420px){
  .books{grid-template-columns:1fr 1fr}
  .hero-pnl{font-size:30px}
}
@media(prefers-reduced-motion:reduce){
  .gridbg,.scanlines,.bgfx{animation:none;display:none}
  .ticker-track{animation:none;flex-wrap:wrap;white-space:normal;transform:none}
  .acard.active,.node.active .orb,.node .orb .radar,.run.on .run-dot,.term .cur{animation:none}
  .chart-stroke{stroke-dasharray:none}
  *{scroll-behavior:auto}
}

</style>
</head>
<body>

<canvas id="bgfx" class="bgfx" aria-hidden="true"></canvas>
<div class="gridbg" aria-hidden="true"></div>
<div class="scanlines" aria-hidden="true"></div>
<div class="shell">
  <header class="top">
    <div class="brand">
      <div class="title">交易台 <span class="pill">模拟盘</span></div>
      <div class="sub" id="mkt"></div>
    </div>
    <div class="head-stats" id="headStats"></div>
    <div class="head-right">
      <div class="run snap" id="run"><i class="run-dot"></i><span id="runLab">同步中</span> · <span id="clock">--:--:-- 伦敦</span></div>
      <div class="upd" id="upd">数据更新于 --</div>
      <a class="nav" href="index.html">返回看板</a>
    </div>
  </header>
  <div class="ticker" id="tickerWrap" aria-label="今日流水"><div class="ticker-track" id="tickerTrack"></div></div>
  <section class="hero" id="hero"></section>
  <aside class="agents" id="agents" aria-label="五个岗位"></aside>
  <section class="flow-wrap">
    <div class="sec-h">传递路径</div>
    <div class="cands" id="cands"></div>
    <div class="pipeline" id="pipeline">
      <svg class="pipe-svg" id="pipeSvg" preserveAspectRatio="none">
        <path id="pipeGlow"></path>
        <path id="pipePath"></path>
      </svg>
      <div class="packets" id="packets"></div>
      <div class="nodes" id="nodes"></div>
    </div>
    <div class="tiles" id="tiles"></div>
    
    <div class="controls">
      <button type="button" id="btnReplay">回放今日</button>
      <button type="button" id="btnPause" hidden>暂停</button>
      <button type="button" id="btnLive" hidden>回到实时</button>
      <label class="note">速度
        <select id="speed" aria-label="回放速度">
          <option value="900">慢</option>
          <option value="500" selected>中</option>
          <option value="220">快</option>
        </select>
      </label>
      <span class="note" id="replayLab"></span>
    </div>
    <p class="note" id="liveNote">状态只根据账本和心跳文件点亮；没有数据就静止，不装忙。</p>

  </section>
  <section class="logs">
    <div class="term-panel">
      <div class="sec-h">活动记录 <span class="term-cmd">tail -f</span></div>
      <div class="term" id="term"></div>
    </div>
    <div class="table-panel">
      <div class="sec-h">决策记录</div>
      <div class="dlog" id="dlog"></div>
    </div>
  </section>
  
  <p class="foot">全部为模拟盘，实盘不动。看这个页面不消耗 token，浏览器每 10 秒只读取数据文件。状态只根据账本和心跳文件点亮；没有数据就静止，不装忙。</p>
  <footer class="bar" id="bar"></footer>

function setCount(el, key, value, fmt){
  if(!el) return;
  const from=prevNum[key];
  prevNum[key]=value;
  if(!Number.isFinite(+value)){ el.textContent=fmt(value); return; }
  if(REDUCE || from==null || from===value || !Number.isFinite(+from)){ el.textContent=fmt(value); return; }
  const t0=performance.now(), dur=700;
  const step=t=>{
    const p=Math.min(1,(t-t0)/dur);
    const e=1-Math.pow(1-p,3);
    el.textContent=fmt(from+(value-from)*e);
    if(p<1) requestAnimationFrame(step);
    else el.textContent=fmt(value);
  };
  requestAnimationFrame(step);
}

function sparkSVG(vals, color, id){
  if(!vals||!vals.length) return "";
  const w=84,h=22,p=2;
  const c=color||"#3effa8";
  if(vals.length===1) return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="M${p} ${h/2} H${w-p}" stroke="${c}" fill="none" stroke-width="1.2"/></svg>`;
  const min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||1;
  const pts=vals.map((v,i)=>{
    const x=p+i*(w-2*p)/(vals.length-1);
    const y=h-p-((v-min)/span)*(h-2*p);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.4"/></svg>`;
}

  const line=vals.map((v,i)=>{const [x,y]=xy(i,v);return (i?"L":"M")+x.toFixed(1)+","+y.toFixed(1);}).join(" ");
  const last=xy(n-1,vals[n-1]), first=xy(0,vals[0]);
  const fill=line+` L${last[0].toFixed(1)},${h-padB} L${first[0].toFixed(1)},${h-padB} Z`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3effa8" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#3effa8" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${fill}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="#3effa8" stroke-width="1.7" class="chart-stroke"/>
  </svg>`;
}

function startBg(){
  if(REDUCE || /[?&]shot=1\b/.test(location.search)) return;
  const c=$("bgfx"); if(!c) return;
  const ctx=c.getContext("2d",{alpha:true});
  let w=0,h=0,pts=[];
  const resize=()=>{
    const dpr=Math.min(2,window.devicePixelRatio||1);
    w=c.clientWidth||window.innerWidth;
    h=c.clientHeight||window.innerHeight;
    c.width=Math.floor(w*dpr); c.height=Math.floor(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(!pts.length) pts=Array.from({length:40},()=>({x:Math.random()*w,y:Math.random()*h,vx:(.12+Math.random()*.28)*(Math.random()<.5?-1:1),vy:-.08-Math.random()*.22}));
  };
  resize();
  addEventListener("resize",resize,{passive:true});
  const tick=()=>{
    if(!document.hidden){
      ctx.clearRect(0,0,w,h);
      ctx.fillStyle="rgba(0,232,255,.4)";
      pts.forEach(p=>{
        p.x+=p.vx; p.y+=p.vy;
        if(p.y<0) p.y=h; if(p.y>h) p.y=0;
        if(p.x<0) p.x=w; if(p.x>w) p.x=0;
        ctx.beginPath(); ctx.arc(p.x,p.y,1.05,0,6.28); ctx.fill();
      });
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function clockTick(){
  try{
    const fmt=new Intl.DateTimeFormat("zh-Hans-GB",{timeZone:"Europe/London",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
    const el=$("clock");
    if(el) el.textContent=fmt.format(new Date())+" 伦敦";
    const upd=$("upd"), run=$("run"), lab=$("runLab");
    if(D&&D.asof){
      const t=parseAsOf(D.asof);
      const sec=t?Math.max(0,Math.round((Date.now()-t)/1000)):null;
      let a="数据更新于 --";
      if(sec!=null){
        if(sec<60) a="数据更新于 "+sec+" 秒前";
        else if(sec<3600) a="数据更新于 "+Math.floor(sec/60)+" 分钟前";
        else a="数据更新于 "+Math.floor(sec/3600)+" 小时前";
      }
      if(upd) upd.textContent=a;
      if(run){
        run.classList.remove("on","stale","snap");
        if(!live){ run.classList.add("snap"); if(lab) lab.textContent="本地快照"; }
        else if(sec!=null && sec>180){ run.classList.add("stale"); if(lab) lab.textContent="数据已过时"; }
        else { run.classList.add("on"); if(lab) lab.textContent="运行中"; }
      }
    }
  }catch(e){}
}

function ticketsAt(d, name){
  const open=[], done=[];
  ticketsOf(d).forEach(t=>{
    if(t.status==="进行中"){

      return;
    }
    const last=(t.events&&t.events[t.events.length-1])||{};
    const lastWho=last.who||t.who;
    if(lastWho===name) done.push(t);
  });
  return open.concat(done).slice(0,4);
}

function layoutPipe(){
  const svg=$("pipeSvg"), path=$("pipePath"), glow=$("pipeGlow");
  const nodes=[...document.querySelectorAll(".node .orb")];
  if(!svg||!path||nodes.length<2) return;
  const wr=svg.getBoundingClientRect();
  if(!wr.width||!wr.height) return;
  svg.setAttribute("viewBox","0 0 "+wr.width+" "+wr.height);
  const pts=nodes.map(el=>{
    const r=el.getBoundingClientRect();
    return {x:r.left+r.width/2-wr.left, y:r.top+r.height/2-wr.top};
  });
  let d=`M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for(let i=1;i<pts.length;i++) d+=` L ${pts[i].x.toFixed(1)} ${pts[i].y.toFixed(1)}`;
  path.setAttribute("d",d);
  if(glow) glow.setAttribute("d",d);
  svg._pts=pts;
}

function spawnPacket(fromName, toName){
  if(REDUCE) return;
  const fi=BOTS.indexOf(fromName), ti=BOTS.indexOf(toName);
  if(fi<0||ti<0||fi===ti) return;
  layoutPipe();
  const path=$("pipePath"), layer=$("packets");
  if(!path||!layer||!path.getTotalLength) return;
  const len=path.getTotalLength(); if(!len) return;
  const n=BOTS.length-1;
  const start=fi/n, end=ti/n;
  const dot=document.createElement("div");
  dot.className="pkt";
  dot.style.background=COLOR[fromName];
  dot.style.color=COLOR[fromName];
  layer.appendChild(dot);
  const t0=performance.now(), dur=900;
  const step=t=>{
    const p=Math.min(1,(t-t0)/dur);
    const e=1-Math.pow(1-p,3);
    const pt=path.getPointAtLength((start+(end-start)*e)*len);
    dot.style.transform=`translate(${pt.x}px,${pt.y}px)`;
    if(p<1) requestAnimationFrame(step);
    else dot.remove();
  };
  requestAnimationFrame(step);
}

function holdEdgeDots(d, ticketMap){
  const layer=$("packets"); if(!layer) return;
  [...layer.querySelectorAll(".pkt.hold")].forEach(x=>x.remove());
  if(REDUCE || /[?&]shot=1\b/.test(location.search)) return;
  const path=$("pipePath"); if(!path||!path.getTotalLength) return;
  const len=path.getTotalLength(); if(!len) return;
  const waiting=new Set();
  if(ticketMap){
    BOTS.forEach(n=>(ticketMap[n]||[]).forEach(t=>{ if(t.waiting) waiting.add(t.waiting); }));
  } else {
    ticketsOf(d).forEach(t=>{ if(t.status==="进行中"&&t.waiting) waiting.add(t.waiting); });
  }
  const n=BOTS.length-1;
  waiting.forEach(name=>{
    const ti=BOTS.indexOf(name);
    if(ti<=0) return;
    const src=BOTS[ti-1];
    const f=(ti-0.5)/n;
    const pt=path.getPointAtLength(f*len);
    const dot=document.createElement("div");
    dot.className="pkt hold";
    dot.style.background=COLOR[src];
    dot.style.color=COLOR[src];
    dot.style.transform=`translate(${pt.x}px,${pt.y}px)`;
    layer.appendChild(dot);
    if(!REDUCE){
      const t0=performance.now();
      const anim=t=>{
        if(!dot.isConnected) return;
        const p=(Math.sin((t-t0)/700)+1)/2;
        const ff=((ti-1)+p)/n;
        const q=path.getPointAtLength(ff*len);
        dot.style.transform=`translate(${q.x}px,${q.y}px)`;
        requestAnimationFrame(anim);
      };
      requestAnimationFrame(anim);
    }
  });
}

function snapshotAt(idx, src){
  const base=src||D;
  const map={}; BOTS.forEach(n=>map[n]=[]);
  const evs=eventsOf(base).slice(0, idx+1);
  const cur={};
  evs.forEach(e=>{
    if(!e.desk || !BOTS.includes(e.who)) return;
    cur[e.id]={id:e.id,sym:e.sym,sym_short:e.sym_short,side:e.side,shadow:e.shadow,status:/否决/.test(e.v)?"已否决":(/通过/.test(e.v)?"已通过":e.v),verdict:e.v,reason:e.txt,who:e.who,stage:e.stage,waiting:e.who};
  });
  Object.values(cur).forEach(t=>{
    const home=t.waiting||t.who;
    if(map[home]) map[home].push(t);
  });
  BOTS.forEach(n=>{ map[n]=map[n].slice(-6); });
  return map;
}
function stopReplay(){
  if(timer){clearTimeout(timer);timer=null;}
  mode="live";
  if($("btnReplay")) $("btnReplay").hidden=false;
  if($("btnPause")) $("btnPause").hidden=true;
  if($("btnLive")) $("btnLive").hidden=true;
  if($("replayLab")) $("replayLab").textContent="";
  if($("liveNote")) $("liveNote").textContent="状态只根据账本和心跳文件点亮；没有数据就静止，不装忙。";
  if(D) renderAll(D);
}
function playReplay(){
  if(!D) return;
  mode="replay";
  if($("btnReplay")) $("btnReplay").hidden=true;
  if($("btnPause")){ $("btnPause").hidden=false; $("btnPause").textContent="暂停"; }
  if($("btnLive")) $("btnLive").hidden=false;
  const evs=eventsOf(D);
  if(replayIdx>=evs.length) replayIdx=0;
  let prevWho=null;
  const step=()=>{
    if(mode!=="replay") return;
    const ev=evs[replayIdx];
    renderCands(D, snapshotAt(replayIdx));
    renderNodes(D, snapshotAt(replayIdx));
    renderTerm(D, replayIdx);
    renderDlog(D, replayIdx);
    if($("replayLab")) $("replayLab").textContent = ev ? `回放 ${shortTs(ev.t)} · ${replayIdx+1}/${evs.length}` : "";
    if(ev && ev.desk && BOTS.includes(ev.who) && prevWho && prevWho!==ev.who) spawnPacket(prevWho, ev.who);
    if(ev && ev.desk && BOTS.includes(ev.who)) prevWho=ev.who;
    replayIdx++;
    if(replayIdx>=evs.length){ if($("replayLab")) $("replayLab").textContent="回放结束"; if($("btnPause")) $("btnPause").hidden=true; return; }
    const ms=Number(($("speed")||{}).value)||500;
    timer=setTimeout(step, ms);
  };
  if($("liveNote")) $("liveNote").textContent="回放的是今天账本里的真实记录；左侧五个状态仍显示此刻的实时状态。";
  step();
}

async function getJsonRaw(url, ms){
  const c=new AbortController();
  const t=setTimeout(()=>c.abort(), ms);
  try{
    const r=await fetch(url,{cache:"no-store",mode:"cors",signal:c.signal});
    if(!r.ok) throw new Error("status "+r.status);
    const j=JSON.parse(new TextDecoder("utf-8").decode(await r.arrayBuffer()));
    if(!j||typeof j!=="object"||j.alg==="AES-GCM") throw new Error("bad format");
    return j;
  } finally { clearTimeout(t); }
}

function extractPayload(j, wantAnim){
  if(!j||typeof j!=="object") return null;
  if(wantAnim){
    let a=null;
    if(okAnim(j)) a=j;
    else if(okAnim(j.anim)) a=Object.assign({}, j.anim);
    if(!a) return null;
    if(j.anim===a || (j.anim && a.asof===j.anim.asof)){
      a.w=a.w??j.w; a.l=a.l??j.l; a.trades=a.trades||j.trades;
      a.stats=a.stats||j.stats; a.equity_hist=a.equity_hist||j.equity_hist;
      a.totals=a.totals||j.totals; a.fx=a.fx||j.fx; a.books=a.books||j.books; a.shadow_books=a.shadow_books||j.shadow_books;
      a.log=a.log||j.log; a.market=a.market||j.market;
    }
    return a;
  }
  if(okBoard(j)||okAnim(j)) return j;
  return null;
}

function applyData(j){
  if(!j||!j.asof) return false;
  if(D){
    const a=parseAsOf(D.asof), b=parseAsOf(j.asof);
    if(a && b && b<a) return false;
    // Keep last good pipeline if a publish raced before anim was embedded.
    if(D.anim && !(j.anim && Array.isArray(j.anim.bots) && j.anim.bots.length)) j.anim=D.anim;
    const prev=lastHomes;
    const next=ticketHomes(j);
    if(mode==="live") diffPackets(prev,next);
    lastHomes=next;
  } else {
    lastHomes=ticketHomes(j);
  }
  D=j; live=true;
  if(mode==="live") renderAll(j);
  else { renderHead(j); renderHero(j); renderAgents(j); renderBar(j); }
  return true;
}

addEventListener("resize",()=>{ layoutPipe(); },{passive:true});
document.addEventListener("click",e=>{
  const b=e.target.closest(".acard");
  if(b){
    const name=b.getAttribute("data-bot");
    openBot=openBot===name?null:name;
  }
});

function clip(s,n){s=String(s??"").replace(/\s+/g," ").trim();return s.length<=n?s:s.slice(0,n-1)+"…";}
function renderMore(d){
  const box=$("moreGrid"); if(!box) return;
  const qs=d.queue||[];
  const qh=qs.length?qs.map(q=>{
    const line=[q.sym,q.side||"",q.v||"",q.next?("→ "+q.next):""].filter(Boolean).join("  ");
    return `<div class="ln">${E(clip(line,40))}</div>`;
  }).join(""):`<div class="ln m">暂无排队</div>`;
  const hs=(d.handoffs||[]).slice(0,8);
  const hh=hs.length?hs.map(h=>{
    const t=(h.t||"").slice(-5);
    return `<div class="ln">${E(clip(t+"  "+(h.frm||h.who||"")+"  "+(h.sym||"")+"  "+(h.v||""),46))}</div>`;
  }).join(""):`<div class="ln m">暂无交接</div>`;
  const rr=d.rej_today||[];
  const rh=(rr.length?rr.map(x=>`<div class="ln">${E(clip(x[0],16))}  ${x[1]}</div>`).join(""):`<div class="ln m">暂无</div>`)+`<div class="ln m">通过 ${d.pass_n||0}  否决 ${d.rej_n||0}</div>`;
  const hb=d.health||[];
  const hbh=hb.length?hb.map(h=>`<div class="ln"><span class="${h.ok?"g":"r"}">●</span> ${E(clip(h.name,16))}  ${h.ok?"在线":"离线"}</div>`).join(""):`<div class="ln m">暂无</div>`;
  const pos=d.positions||[], ord=d.orders||[];
  let po="";
  if(pos.length) po+=pos.map(p=>`<div class="ln">${E(p.sym)} ${E(p.side)} ${E(p.qty)}  ${usd(p.upl)}</div>`).join("");
  if(ord.length) po+=ord.map(o=>`<div class="ln">${E(o.sym)} ${E(o.side)} ${E(o.type)}  ${E(o.status)}</div>`).join("");
  if(!po) po=`<div class="ln m">暂无持仓或委托</div>`;
  const wl=$("wl");
  if(wl){
    const st=statsOf(d);
    wl.textContent=(st.wins!=null?st.wins:(d.w||0))+" 胜 / "+(st.losses!=null?st.losses:(d.l||0))+" 负";
  }
  box.innerHTML=`<div><div class="sec-h">排队</div>${qh}</div>
    <div><div class="sec-h">交接</div>${hh}</div>
    <div><div class="sec-h">否决规则</div>${rh}</div>
    <div><div class="sec-h">心跳</div>${hbh}</div>
    <div style="grid-column:1/-1"><div class="sec-h">持仓</div>${po}</div>`;
}



clockTick(); setInterval(clockTick, 1000);
startBg();
if($("btnReplay")) $("btnReplay").addEventListener("click",()=>{replayIdx=0;playReplay();});
if($("btnPause")) $("btnPause").addEventListener("click",()=>{
  if(timer){clearTimeout(timer);timer=null;$("btnPause").textContent="继续";}
  else{$("btnPause").textContent="暂停";playReplay();}
});
if($("btnLive")) $("btnLive").addEventListener("click", stopReplay);

function showSnap(){
  try{
    const a=extractPayload(SNAP, true) || (SNAP && SNAP.asof ? SNAP : null);
    if(!a) return false;
    D=a; live=false; lastHomes=ticketHomes(a); renderAll(a); return true;
  }catch(e){ return false; }
}
async function load(){
  const t=Date.now();
  
  const urls=[
    "https://jsonstorage.com/fFQXPk3yYOC9Z9?t="+t,
    "anim.json?t="+t,
    "data.json?t="+t,
    "https://raw.githubusercontent.com/R1each/desk-board/data/anim.json?t="+t,
    "https://raw.githubusercontent.com/R1each/desk-board/data/data.json?t="+t
  ];

  for(const u of urls){
    try{
      const j=await getJsonRaw(u, 4000);
      const a=extractPayload(j, true);
      if(a && applyData(a)) return;
    }catch(e){}
  }
  throw new Error("fetch failed");
}
showSnap();
(async()=>{
  try{ await load(); }catch(e){ if(!D) { const n=$("mkt"); if(n) n.textContent="还没有读到数据文件"; } }
  setInterval(async()=>{ try{ await load(); }catch(e){} }, 10000);
})();
