<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0e14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<title>交易台动画 · 模拟盘</title>
<style>
:root{
  --bg:#0b0e14; --card:#151a23; --line:#2a3140; --tx:#e8edf5; --mut:#8b95a8;
  --g:#3ecf8e; --r:#ff6b6b; --a:#f5b94a; --b:#6aa9ff; --v:#b18cff; --dim:#5c6578;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);
  font-family:"Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC","PingFang SC","Microsoft YaHei","Heiti SC",sans-serif;
  font-size:15px;line-height:1.45}
a{color:var(--b);text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:10px 12px 28px}
.top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{font-size:18px;margin:0;font-weight:700}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--a);font-size:12px;margin-left:6px;vertical-align:2px}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;color:var(--mut)}
.hb{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--line);border-radius:99px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--dim);flex:0 0 auto}
.dot.ok{background:var(--g);box-shadow:0 0 8px var(--g)}
.dot.bad{background:var(--r);box-shadow:0 0 8px var(--r)}
.books{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
@media(max-width:900px){.books{grid-template-columns:1fr 1fr}}
.book{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;min-width:0}
.book h2{margin:0 0 4px;font-size:12px;color:var(--mut);font-weight:500;letter-spacing:.04em}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.kv b{font-variant-numeric:tabular-nums;font-weight:700}
.g{color:var(--g)}.r{color:var(--r)}.m{color:var(--mut)}.a{color:var(--a)}.v{color:var(--v)}
.pipeline{overflow-x:auto;padding:6px 0 10px;-webkit-overflow-scrolling:touch}
.stations{display:flex;gap:0;min-width:900px;position:relative;align-items:flex-start}
.stations:before{content:"";position:absolute;left:6%;right:6%;top:78px;height:3px;background:linear-gradient(90deg,#2a3140,#3a4a66,#2a3140);border-radius:2px;z-index:0}
.st{flex:1;min-width:160px;text-align:center;position:relative;z-index:1;padding:0 6px}
.avatar{width:92px;height:92px;margin:0 auto 6px;position:relative}
.avatar svg{width:92px;height:92px;display:block;filter:grayscale(.25) brightness(.85);transition:filter .3s,opacity .3s}
.st.on_duty .avatar svg,.st.scanning .avatar svg{filter:none;opacity:1}
.st.idle .avatar svg,.st.unknown .avatar svg{filter:grayscale(.55) brightness(.65);opacity:.55}
.lamp-wrap{position:absolute;right:-2px;top:-2px;width:28px;height:28px}
.lamp{width:12px;height:12px;border-radius:50%;background:var(--dim);position:absolute;right:5px;top:5px;z-index:2}
.st.on_duty .lamp{background:var(--g);box-shadow:0 0 10px var(--g);animation:glow 1.6s ease-in-out infinite}
.st.scanning .lamp{background:var(--a);box-shadow:0 0 10px var(--a)}
.ring{position:absolute;inset:0;border:2px dashed var(--a);border-radius:50%;opacity:0}
.st.scanning .ring{opacity:1;animation:spin 1s linear infinite}
.nm{font-weight:700;font-size:15px}
.bubble{margin:6px auto 0;background:#1c232e;border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-height:52px;cursor:pointer;text-align:left}
.st.on_duty .bubble{border-color:#245a43;background:#12261d}
.st.scanning .bubble{border-color:#6b5420;background:#2a2212}
.st.idle .bubble,.st.unknown .bubble{opacity:.9}
.status{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src{font-size:11px;color:var(--mut);line-height:1.3;margin-top:2px;word-break:break-all}
.tickets{min-height:88px;margin-top:8px;display:flex;flex-direction:column;gap:6px;align-items:center}
.card{width:100%;max-width:168px;background:#1a2030;border:1px solid #3a4558;border-radius:9px;padding:6px 8px;font-size:12px;text-align:left;
  animation:pop .35s ease;position:relative}
.card.shadow{border-color:var(--v);background:#1a1730}
.card.pass{border-color:#245a43}
.card.rej{border-color:#6b2b2b;background:#2a1414}
.card .id{font-family:ui-monospace,Menlo,monospace;color:var(--mut);font-size:10px}
.card .ttl{font-weight:700;font-size:13px}
.badge{display:inline-block;font-size:10px;padding:0 5px;border-radius:6px;margin-left:3px;border:1px solid var(--v);color:var(--v)}
.mark{font-weight:700}
.why{color:var(--mut);font-size:11px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 10px}
button{background:#1c232e;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
button:hover{border-color:var(--b)}
button.on{background:#12261d;border-color:#245a43;color:var(--g)}
.note{font-size:12px;color:var(--mut)}
.events{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-height:280px;overflow:auto}
.events h2,.legend{font-size:13px;color:var(--mut);margin:0 0 6px;font-weight:600}
.ev{display:flex;gap:8px;font-size:13px;padding:3px 0;border-bottom:1px solid #1d222b}
.ev .t{flex:0 0 42px;color:var(--mut);font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--mut);margin-top:12px}
.detail{display:none;margin-top:6px;font-size:12px;color:var(--tx);background:#0f131a;border-radius:8px;padding:6px 8px;white-space:normal}
.bubble.open .detail{display:block}
@keyframes glow{50%{box-shadow:0 0 16px var(--g);opacity:.75}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}
.foot{margin-top:14px;font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>交易台动画 <span class="pill">模拟盘</span></h1>
    <div class="meta">
      <span id="clock">--:--:-- 伦敦</span>
      <span class="hb" id="hb" title="扫盘心跳">心跳</span>
      <a href="index.html">返回看板</a>
    </div>
  </div>
  <div class="books" id="books"></div>
  <div class="note" id="liveNote">上方五个状态是实时的，只根据账本和心跳文件点亮；没有数据就静止，不装忙。</div>
  <div class="pipeline"><div class="stations" id="stations"></div></div>
  <div class="controls">
    <button type="button" id="btnReplay">回放今日</button>
    <button type="button" id="btnPause" hidden>暂停</button>
    <button type="button" id="btnLive" hidden>回到实时</button>
    <label class="note">速度
      <select id="speed" aria-label="回放速度">
        <option value="900">慢</option>
        <option value="500" selected>中</option>
        <option value="220">快</option>
      </select>
    </label>
    <span class="note" id="replayLab"></span>
  </div>
  <div class="events">
    <h2>今日流水</h2>
    <div id="events"></div>
  </div>
  <div class="foot">全部为模拟盘，实盘不动。看这个页面不消耗 token，浏览器每 60 秒只读取数据文件。点头像下的状态可看来源和时间。</div>
</div>

};
let D=null, live=false, mode="live", timer=null, replayIdx=0, openBot=null;

function okData(j){return j && typeof j==="object" && j.asof && Array.isArray(j.bots) && Array.isArray(j.tickets);}
function clockTick(){
  try{
    const fmt=new Intl.DateTimeFormat("zh-Hans-GB",{timeZone:"Europe/London",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
    $("clock").textContent=fmt.format(new Date())+" 伦敦";
  }catch(e){}
}
function cardHTML(t){
  const rej=/否决/.test(t.status||t.verdict||"");
  const pass=/通过/.test(t.verdict||"") && !rej;
  const cls=["card", t.shadow?"shadow":"", rej?"rej":(pass?"pass":"")].filter(Boolean).join(" ");
  const side=t.side==="short"?"空单":t.side==="long"?"多单":"";
  const mark=rej?`<span class="mark r">否决</span>`:(pass?`<span class="mark g">通过</span>`:`<span class="mark a">${E(t.status||t.verdict||"")}</span>`);
  return `<div class="${cls}" data-id="${E(t.id)}" title="${E(t.reason||"")}">
    <div class="id">${E(t.id)}</div>
    <div class="ttl">${E(t.sym_short||t.sym||"")} ${E(side)}${t.shadow?`<span class="badge">影子</span>`:""}</div>
    <div>${mark}</div>
    <div class="why">${E(t.reason||"")}</div>
  </div>`;
}
function renderBooks(d){
  $("books").innerHTML=(d.books||[]).map(b=>{
    const today=b.today==null?`<span class="m">今日 —</span>`:`<span class="${cl(b.today)}">今日 ${money(b.today,b.ccy)}</span>`;
    return `<div class="book"><h2>${E(b.name)} · 本金 ${money(b.principal,b.ccy,0)}</h2>
      <div class="kv"><span>净值</span><b>${money(b.equity,b.ccy,0)}</b></div>
      <div class="kv">${today}<b class="${cl(b.total)}">累计 ${money(b.total,b.ccy)}</b></div>
    </div>`;
  }).join("");
}
function renderHB(d){
  const s=d.scanner||{};
  const ok=!!s.ok, miss=!s.present;
  const lab=miss?"心跳 无数据":(s.scanning?"心跳 正在扫盘":(ok?"心跳 正常":"心跳 已超过3分钟"));
  $("hb").innerHTML=`<span class="dot ${miss?"":(ok?"ok":"bad")}"></span>${E(lab)} · ${E((s.ts||"").slice(11)||"—")} · ${E((s.src||"").split("/").pop())}`;
  $("hb").title=E((s.detail||"")+" 来源 "+(s.src||"")+" 时间 "+(s.ts||""));
}
function ticketsAt(d, name, stage){
  return (d.tickets||[]).filter(t=>{
    if(t.status==="进行中") return t.waiting===name || t.stage===stage;
    const last=(t.events&&t.events[t.events.length-1])||{};
    const lastStage=last.stage||t.stage;
    const lastWho=last.who||t.who;
    return lastWho===name || lastStage===stage;
  }).slice(0,6);
}
function renderStations(d, ticketMap){
  const byName={};
  (d.bots||[]).forEach(b=>byName[b.name]=b);
  $("stations").innerHTML=BOTS.map((name,i)=>{
    const b=byName[name]||{name,state:"unknown",status:"无数据",src:"",ts:"",detail:""};
    const state=b.state||"unknown";
    const tickets=ticketMap? (ticketMap[name]||[]) : ticketsAt(d,name,i+1);
    const open=openBot===name?" open":"";
    return `<div class="st ${E(state)}" data-bot="${E(name)}">
      <div class="avatar">${FACE[name]}
        <div class="lamp-wrap"><i class="ring"></i><i class="lamp"></i></div>
      </div>
      <div class="nm">${E(name)}</div>
      <div class="bubble${open}" data-bot="${E(name)}" title="${E(b.detail||"")}">
        <div class="status">${E(b.status||"无数据")}</div>
        <div class="src">${E(b.src||"无来源")} · ${E(b.ts||"—")}</div>
        <div class="detail">${E(b.detail||"没有更多说明")}</div>
      </div>
      <div class="tickets" data-slot="${E(name)}">${tickets.map(cardHTML).join("")||""}</div>
    </div>`;
  }).join("");
}
function renderEvents(d, highlight){
  const ev=(d.today_events||[]).slice().reverse();
  $("events").innerHTML=ev.length?ev.map((e,i)=>{
    const t=(e.t||"").slice(11);
    const on=highlight!=null && (ev.length-1-i)===highlight?" style=\"background:#1c2a20\"":"";
    const mark=/否决/.test(e.v||"")?"r":(/通过/.test(e.v||"")?"g":"a");
    return `<div class="ev"${on}><span class="t">${E(t)}</span><span>${E(e.who)} · ${E(e.sym_short||e.sym||"")} <span class="${mark}">${E(e.v)}</span> ${E((e.txt||"").slice(0,36))}</span></div>`;
  }).join(""):`<div class="m">今天还没有流水</div>`;
}
function render(d){
  if(!d) return;
  D=d;
  renderBooks(d);
  renderHB(d);
  if(mode==="live") renderStations(d);
  renderEvents(d, mode==="replay"?replayIdx:null);
  $("liveNote").textContent = mode==="replay"
    ? "回放的是今天账本里的真实记录；上面五个灯仍显示此刻的实时状态。"
    : "上方五个状态是实时的，只根据账本和心跳文件点亮；没有数据就静止，不装忙。";
}

/* replay moves cards from real today_events only */
function snapshotAt(idx){
  const map={}; BOTS.forEach(n=>map[n]=[]);
  const evs=(D.today_events||[]).slice(0, idx+1);
  const cur={};
  evs.forEach(e=>{
    if(!e.desk || !BOTS.includes(e.who)) return;
    const id=e.id;
    cur[id]={id,sym:e.sym,sym_short:e.sym_short,side:e.side,shadow:e.shadow,status:/否决/.test(e.v)?"已否决":(/通过/.test(e.v)?"已通过":e.v),verdict:e.v,reason:e.txt,who:e.who,stage:e.stage,waiting:""};
    const rec=cur[id];
    if(/否决/.test(e.v) || /通过/.test(e.v)){
      /* sit at the bot who just acted */
      rec.waiting=e.who;
    }
  });
  Object.values(cur).forEach(t=>{
    const home=t.waiting||t.who;
    if(map[home]) map[home].push(t);
  });
  BOTS.forEach(n=>{ map[n]=map[n].slice(-6); });
  return map;
}
function stopReplay(){
  if(timer){clearTimeout(timer);timer=null;}
  mode="live";
  $("btnReplay").hidden=false; $("btnPause").hidden=true; $("btnLive").hidden=true;
  $("replayLab").textContent="";
  if(D) renderStations(D);
  renderEvents(D,null);
  $("liveNote").textContent="上方五个状态是实时的，只根据账本和心跳文件点亮；没有数据就静止，不装忙。";
}
function playReplay(){
  if(!D) return;
  mode="replay";
  $("btnReplay").hidden=true; $("btnPause").hidden=false; $("btnLive").hidden=false;
  const evs=D.today_events||[];
  if(replayIdx>=evs.length) replayIdx=0;
  const step=()=>{
    if(mode!=="replay") return;
    renderStations(D, snapshotAt(replayIdx));
    renderEvents(D, replayIdx);
    $("replayLab").textContent = evs[replayIdx] ? `回放 ${evs[replayIdx].t.slice(11)} · ${replayIdx+1}/${evs.length}` : "";
    replayIdx++;
    if(replayIdx>=evs.length){ $("replayLab").textContent="回放结束"; $("btnPause").hidden=true; return; }
    const ms=Number($("speed").value)||500;
    timer=setTimeout(step, ms);
  };
  step();
}

document.addEventListener("click",e=>{
  const b=e.target.closest(".bubble");
  if(b){
    const name=b.getAttribute("data-bot");
    openBot = openBot===name?null:name;
    if(D && mode==="live") renderStations(D);
    else if(D) { /* keep replay tickets, just toggle class */ 
      document.querySelectorAll(".bubble").forEach(x=>x.classList.toggle("open", x.getAttribute("data-bot")===openBot));
    }
  }
});
$("btnReplay").addEventListener("click",()=>{replayIdx=0;playReplay();});
$("btnPause").addEventListener("click",()=>{
  if(timer){clearTimeout(timer);timer=null;$("btnPause").textContent="继续";}
  else{$("btnPause").textContent="暂停";playReplay();}
});
$("btnLive").addEventListener("click", stopReplay);

async function getJson(url, ms){
  const c=new AbortController();
  const t=setTimeout(()=>c.abort(), ms);
  try{
    const r=await fetch(url,{cache:"no-store",mode:"cors",signal:c.signal});
    if(!r.ok) throw new Error("status "+r.status);
    const j=JSON.parse(new TextDecoder("utf-8").decode(await r.arrayBuffer()));
    if(!okData(j)) throw new Error("bad format");
    return j;
  } finally { clearTimeout(t); }
}
async function latestSha(){
  const c=new AbortController();
  const t=setTimeout(()=>c.abort(), 4000);
  try{
    const r=await fetch("https://api.github.com/repos/R1each/desk-board/commits/data?per_page=1",{cache:"no-store",mode:"cors",signal:c.signal,headers:{Accept:"application/vnd.github+json"}});
    if(!r.ok) throw 0;
    const j=await r.json();
    return j && j.sha;
  } finally { clearTimeout(t); }
}
function applyData(j){
  if(!okData(j)) return false;
  if(D){
    const a=Date.parse((D.asof||"").replace(" ","T")+"+00:00");
    const b=Date.parse((j.asof||"").replace(" ","T")+"+00:00");
    if(Number.isFinite(a)&&Number.isFinite(b)&&b<a) return false;
  }
  D=j; live=true; if(mode==="live") render(j); else { renderBooks(j); renderHB(j); } return true;
}
async function load(){
  const t=Date.now();
  const urls=[
    "anim.json?t="+t,
    "https://raw.githubusercontent.com/R1each/desk-board/data/anim.json?t="+t,
    "https://cdn.jsdelivr.net/gh/R1each/desk-board@data/anim.json?t="+t,
    "https://rawcdn.githack.com/R1each/desk-board/data/anim.json?t="+t
  ];
  try{
    const sha=await latestSha();
    if(sha) urls.splice(1,0,"https://raw.githubusercontent.com/R1each/desk-board/"+sha+"/anim.json");
  }catch(e){}
  for(const u of urls){
    try{ if(applyData(await getJson(u, 5000))) return; }catch(e){}
  }
  throw new Error("fetch failed");
}

if(okData(SNAP)){ D=SNAP; live=false; render(SNAP); }
clockTick(); setInterval(clockTick,1000);
(async()=>{
  try{ await load(); }catch(e){ if(!D) $("liveNote").textContent="还没有读到数据文件"; }
  setInterval(async()=>{ try{ await load(); }catch(e){} }, 60000);
})();
</script>
